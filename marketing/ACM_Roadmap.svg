<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     font-family="Georgia, 'Iowan Old Style', serif">
<title>Aladdin's Castle — a roadmap of places, not dates</title>

<defs>
  <!-- Night sky. Warm at the horizon where the castles are, cold above. -->
  <radialGradient id="sky" cx="52%" cy="72%" r="86%">
    <stop offset="0%"  stop-color="#1d2450"/>
    <stop offset="45%" stop-color="#121736"/>
    <stop offset="100%" stop-color="#080a1b"/>
  </radialGradient>

  <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f3e4b0" stop-opacity=".55"/>
    <stop offset="45%" stop-color="#e8d69c" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#e8d69c" stop-opacity="0"/>
  </radialGradient>

  <!-- Island: lit from the right, where the waking castle is. -->
  <linearGradient id="turf" x1="0" y1="0" x2="1" y2="0.4">
    <stop offset="0%"  stop-color="#1b2a44"/>
    <stop offset="55%" stop-color="#24384f"/>
    <stop offset="100%" stop-color="#3a4a52"/>
  </linearGradient>
  <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#1a2338"/>
    <stop offset="55%"  stop-color="#121a2c"/>
    <stop offset="100%" stop-color="#0b0f1e" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#6b6a63"/>
    <stop offset="50%"  stop-color="#b9a978"/>
    <stop offset="100%" stop-color="#e6cf95"/>
  </linearGradient>

  <radialGradient id="warm" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffca6a" stop-opacity=".85"/>
    <stop offset="55%" stop-color="#ff9d3c" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#ff9d3c" stop-opacity="0"/>
  </radialGradient>

  <!-- Hand-drawn wobble. Everything painterly runs through this so no edge is
       mechanically straight — the difference between a drawing and a diagram. -->
  <filter id="ink" x="-12%" y="-12%" width="124%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="inkSoft" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="19" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="glowBig" x="-90%" y="-90%" width="280%" height="280%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>

  <!-- Paper grain, kept faint. -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>

  <symbol id="star" viewBox="0 0 10 10">
    <path d="M5 0 L5.9 4.1 L10 5 L5.9 5.9 L5 10 L4.1 5.9 L0 5 L4.1 4.1 Z" fill="#fff"/>
  </symbol>
</defs>

<rect width="1600" height="900" fill="url(#sky)"/>

<!-- ── stars ───────────────────────────────────────────────────────────── -->
<g id="stars" opacity=".85">
  <g fill="#ffffff">
    <circle cx="120"  cy="90"  r="1.5" opacity=".8"/><circle cx="240" cy="150" r="1"   opacity=".5"/>
    <circle cx="330"  cy="70"  r="1.2" opacity=".65"/><circle cx="470" cy="130" r="1"  opacity=".45"/>
    <circle cx="590"  cy="60"  r="1.6" opacity=".75"/><circle cx="700" cy="170" r="1"  opacity=".4"/>
    <circle cx="820"  cy="95"  r="1.2" opacity=".6"/><circle cx="960" cy="60"  r="1"   opacity=".5"/>
    <circle cx="1090" cy="140" r="1.4" opacity=".7"/><circle cx="1230" cy="80" r="1"   opacity=".45"/>
    <circle cx="1350" cy="160" r="1.3" opacity=".6"/><circle cx="1480" cy="100" r="1"  opacity=".5"/>
    <circle cx="180"  cy="230" r="1"   opacity=".4"/><circle cx="1540" cy="240" r="1.2" opacity=".5"/>
    <circle cx="60"   cy="330" r="1"   opacity=".35"/><circle cx="1420" cy="300" r="1" opacity=".4"/>
    <circle cx="760"  cy="220" r="1"   opacity=".35"/><circle cx="1180" cy="215" r="1" opacity=".4"/>
  </g>
  <use href="#star" x="286" y="112" width="13" height="13" opacity=".85"/>
  <use href="#star" x="1284" y="122" width="11" height="11" opacity=".7"/>
  <use href="#star" x="905"  y="150" width="9"  height="9"  opacity=".6"/>
</g>

<!-- ── moon ────────────────────────────────────────────────────────────── -->
<g>
  <circle cx="1332" cy="176" r="190" fill="url(#moonGlow)"/>
  <circle cx="1332" cy="176" r="52" fill="#f0e2b6" opacity=".92"/>
  <circle cx="1350" cy="164" r="52" fill="#121736" opacity=".55"/>
</g>

<!-- ── title ───────────────────────────────────────────────────────────── -->
<g>
  <text x="88" y="112" font-size="52" fill="#f4e7c8" letter-spacing="1.5">Aladdin&#8217;s Castle</text>
  <text x="90" y="152" font-size="21" fill="#c9a84c" letter-spacing="5.5"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif">BORN FOR THE DEAD, TO BRING BACK TO LIFE</text>
  <text x="92" y="182" font-size="13.5" fill="#7d86a8" letter-spacing="2.4"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A ROADMAP OF PLACES, NOT DATES</text>
</g>

<!-- ── the island ──────────────────────────────────────────────────────── -->
<g filter="url(#ink)">
  <!-- underside: rock tapering into mist, so the island reads as floating -->
  <path d="M150 596 C 236 700 300 742 372 754 C 430 830 470 856 512 800
           C 566 872 622 858 660 792 C 726 852 786 828 812 762
           C 884 812 950 790 984 730 C 1064 776 1130 742 1160 686
           C 1250 716 1330 676 1372 612 C 1442 662 1512 642 1556 598 Z"
        fill="url(#rock)"/>
  <!-- top surface -->
  <path d="M150 596 C 128 528 196 470 286 452 C 330 396 424 372 502 392
           C 566 336 690 328 758 372 C 838 330 946 344 996 396
           C 1090 372 1188 396 1226 448 C 1330 452 1412 486 1462 518
           C 1524 542 1562 566 1556 598 C 1442 640 1180 668 940 682
           C 700 696 452 682 292 650 C 214 634 166 616 150 596 Z"
        fill="url(#turf)"/>
  <!-- shoreline highlight, catching the moon -->
  <path d="M292 650 C 452 682 700 696 940 682 C 1180 668 1400 632 1556 598"
        fill="none" stroke="#8fa6ad" stroke-opacity=".33" stroke-width="2.4"/>
</g>

<!-- ── the road ────────────────────────────────────────────────────────── -->
<g filter="url(#inkSoft)">
  <path id="rd" d="M212 604 C 300 566 336 500 404 480 C 470 460 486 556 556 566
                   C 626 576 634 512 706 494 C 780 476 792 566 866 560
                   C 918 556 916 480 972 468 C 1032 456 1046 546 1108 534
                   C 1166 522 1170 468 1232 458 C 1300 448 1340 500 1392 470
                   C 1440 448 1470 496 1520 528"
        fill="none" stroke="url(#road)" stroke-width="15" stroke-linecap="round" opacity=".9"/>
  <path d="M212 604 C 300 566 336 500 404 480 C 470 460 486 556 556 566
           C 626 576 634 512 706 494 C 780 476 792 566 866 560
           C 918 556 916 480 972 468 C 1032 456 1046 546 1108 534
           C 1166 522 1170 468 1232 458 C 1300 448 1340 500 1392 470
           C 1440 448 1470 496 1520 528"
        fill="none" stroke="#0d1224" stroke-width="15" stroke-linecap="round"
        stroke-dasharray="1 26" opacity=".5"/>
</g>

<!-- ═══════════════ SCENES ═══════════════ -->

<!-- 1 · THE SLEEPING CASTLE — dark, unlit, where it begins -->
<g filter="url(#inkSoft)">
  <path d="M168 604 h96 v-64 h-96 z" fill="#0f1730"/>
  <path d="M180 540 q12 -34 0 -46 q-12 12 0 46 z" fill="#0f1730"/>
  <path d="M216 540 q16 -44 0 -60 q-16 16 0 60 z" fill="#111a34"/>
  <path d="M252 540 q12 -34 0 -46 q-12 12 0 46 z" fill="#0f1730"/>
  <g fill="#2b3557"><rect x="186" y="562" width="9" height="16"/><rect x="212" y="562" width="9" height="16"/>
     <rect x="238" y="562" width="9" height="16"/></g>
  <path d="M170 604 q46 -16 92 0" fill="none" stroke="#5b6483" stroke-opacity=".4" stroke-width="1.6"/>
</g>

<!-- 2 · THE DREAMER'S COIN — a sleeper, and a coin dreamt into being -->
<g>
  <circle cx="404" cy="452" r="46" fill="url(#warm)"/>
  <g filter="url(#inkSoft)">
    <path d="M382 486 q22 -12 44 0 q-22 8 -44 0 z" fill="#1d2742"/>
    <path d="M388 486 q16 -22 32 0 z" fill="#243050"/>
  </g>
  <circle cx="404" cy="450" r="15" fill="#f0c96a" filter="url(#glow)" opacity=".9"/>
  <circle cx="404" cy="450" r="11.5" fill="#e8bf5c" stroke="#8d6c22" stroke-width="1.4"/>
  <text x="404" y="455" font-size="11" fill="#6b5117" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold">A</text>
</g>

<!-- 3 · THE VAULT OF HALVES — a sealed door, half in light -->
<g filter="url(#inkSoft)">
  <path d="M524 588 h74 v-52 a37 37 0 0 0 -74 0 z" fill="#141e39"/>
  <circle cx="561" cy="548" r="25" fill="#1b2745"/>
  <path d="M561 523 a25 25 0 0 1 0 50 z" fill="#2c3a60"/>
  <circle cx="561" cy="548" r="25" fill="none" stroke="#7b86ab" stroke-opacity=".5" stroke-width="2"/>
  <circle cx="561" cy="548" r="6" fill="#c9a84c"/>
  <g stroke="#7b86ab" stroke-opacity=".45" stroke-width="1.6">
    <path d="M561 530 v-8"/><path d="M561 574 v8"/><path d="M543 548 h-8"/><path d="M579 548 h8"/>
  </g>
</g>

<!-- 4 · THE CABINET YARD — cabinets under canvas, sparks -->
<g filter="url(#inkSoft)">
  <path d="M660 512 h108 l-10 -26 h-88 z" fill="#2a2035" opacity=".9"/>
  <g>
    <rect x="672" y="470" width="24" height="44" rx="3" fill="#1a2440"/>
    <rect x="675" y="476" width="18" height="14" rx="2" fill="#4de0c8" opacity=".8"/>
    <rect x="704" y="466" width="24" height="48" rx="3" fill="#22182e"/>
    <rect x="707" y="472" width="18" height="14" rx="2" fill="#ff7a9c" opacity=".8"/>
    <rect x="736" y="474" width="24" height="40" rx="3" fill="#1a2440"/>
    <rect x="739" y="480" width="18" height="13" rx="2" fill="#ffcf6a" opacity=".8"/>
  </g>
  <g fill="#ffd27a" opacity=".95">
    <circle cx="700" cy="458" r="2"/><circle cx="712" cy="450" r="1.4"/><circle cx="691" cy="449" r="1.2"/>
  </g>
</g>

<!-- 5 · THE BACKGLASS GATE — the doorway in. the app. -->
<g>
  <ellipse cx="866" cy="556" rx="62" ry="40" fill="url(#warm)" opacity=".85"/>
  <g filter="url(#inkSoft)">
    <path d="M838 580 v-44 a28 28 0 0 1 56 0 v44 z" fill="#20182c" stroke="#c9a84c"
          stroke-width="2.4" stroke-opacity=".85"/>
    <path d="M848 580 v-40 a18 18 0 0 1 36 0 v40 z" fill="#ffce78" opacity=".92"/>
    <path d="M866 540 q-9 12 0 26 q9 -14 0 -26 z" fill="#c07a2e" opacity=".55"/>
  </g>
  <g fill="#ffe6ab"><circle cx="838" cy="536" r="2.6"/><circle cx="866" cy="522" r="2.6"/>
     <circle cx="894" cy="536" r="2.6"/></g>
</g>

<!-- 6 · THE FREE LANTERN — anyone may take one, no toll -->
<g>
  <circle cx="972" cy="452" r="58" fill="url(#warm)"/>
  <g filter="url(#inkSoft)">
    <path d="M972 400 v14" stroke="#8d6c22" stroke-width="2.2"/>
    <path d="M958 442 l14 -28 l14 28 v20 h-28 z" fill="#f2c563" stroke="#8d6c22" stroke-width="1.6"/>
    <circle cx="972" cy="450" r="7" fill="#fff4d0"/>
  </g>
  <g stroke="#ffd88a" stroke-opacity=".5" stroke-width="1.6">
    <path d="M972 470 v18"/><path d="M948 462 l-14 12"/><path d="M996 462 l14 12"/>
  </g>
</g>

<!-- 7 · THE COUNTER — where a credit becomes play -->
<g filter="url(#inkSoft)">
  <path d="M1074 560 h72 v-30 h-72 z" fill="#1b2440"/>
  <path d="M1068 530 h84 v-9 h-84 z" fill="#2d3a5e"/>
  <rect x="1096" y="492" width="28" height="26" rx="3" fill="#141c33" stroke="#7b86ab"
        stroke-opacity=".6" stroke-width="1.4"/>
  <g fill="#5fd08a" opacity=".9">
    <rect x="1101" y="498" width="3" height="14"/><rect x="1106" y="498" width="2" height="14"/>
    <rect x="1110" y="498" width="4" height="14"/><rect x="1116" y="498" width="2" height="14"/>
  </g>
  <path d="M1110 518 v10" stroke="#5fd08a" stroke-opacity=".55" stroke-width="1.6"/>
</g>

<!-- 8 · THE COINING HOUSE — metal tokens struck and recirculating -->
<g filter="url(#inkSoft)">
  <path d="M1200 462 h74 v-38 l-37 -22 l-37 22 z" fill="#1c2742"/>
  <rect x="1224" y="436" width="26" height="26" fill="#0f1730"/>
  <g fill="#c9a84c" opacity=".95">
    <ellipse cx="1288" cy="464" rx="13" ry="4.4"/>
    <ellipse cx="1288" cy="457" rx="13" ry="4.4" opacity=".85"/>
    <ellipse cx="1288" cy="450" rx="13" ry="4.4" opacity=".7"/>
  </g>
  <circle cx="1237" cy="414" r="4" fill="#ffd27a" opacity=".8"/>
</g>

<!-- 9 · THE FIRST CASTLE WAKES — the mirror of scene 1, lit -->
<g>
  <ellipse cx="1386" cy="474" rx="76" ry="58" fill="url(#warm)" opacity=".88"/>
  <g filter="url(#inkSoft)">
    <path d="M1344 508 h96 v-66 h-96 z" fill="#2a2038"/>
    <path d="M1356 442 q12 -36 0 -48 q-12 12 0 48 z" fill="#c0402f"/>
    <path d="M1392 442 q17 -46 0 -62 q-17 16 0 62 z" fill="#d24a34"/>
    <path d="M1428 442 q12 -36 0 -48 q-12 12 0 48 z" fill="#c0402f"/>
    <g fill="#ffd98f">
      <rect x="1362" y="462" width="10" height="18"/><rect x="1387" y="462" width="10" height="18"/>
      <rect x="1412" y="462" width="10" height="18"/>
    </g>
    <path d="M1380 508 v-22 h24 v22 z" fill="#ffe6ab"/>
  </g>
  <g fill="#ffe6ab"><circle cx="1356" cy="386" r="2.4"/><circle cx="1392" cy="372" r="2.8"/>
     <circle cx="1428" cy="386" r="2.4"/></g>
</g>

<!-- 10 · THE LONG ROAD — more castles, receding, unnamed -->
<g opacity=".6" filter="url(#inkSoft)">
  <path d="M1454 512 h34 v-22 h-34 z" fill="#2a3352"/>
  <path d="M1471 490 q8 -21 0 -28 q-8 9 0 28 z" fill="#39445f"/>
  <path d="M1512 522 h26 v-17 h-26 z" fill="#232c48"/>
  <path d="M1525 505 q6 -16 0 -21 q-6 7 0 21 z" fill="#2e3752"/>
</g>

<!-- ═══════════════ LABELS ═══════════════ -->
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

  <!-- helper geometry is inlined per label so each card sits clear of the art -->
  <g>
    <text x="216" y="654" font-size="17.5" fill="#eadfc4" text-anchor="middle"
          font-family="Georgia, serif">The Sleeping Castle</text>
    <text x="216" y="674" font-size="11.5" fill="#8a93b5" text-anchor="middle">where it went dark</text>
    <rect x="176" y="686" width="80" height="17" rx="8.5" fill="#232b46"/>
    <text x="216" y="698" font-size="9" fill="#98a2c4" text-anchor="middle" letter-spacing="1.4">ORIGIN</text>
  </g>

  <g>
    <text x="404" y="378" font-size="17.5" fill="#eadfc4" text-anchor="middle"
          font-family="Georgia, serif">The Dreamer&#8217;s Coin</text>
    <text x="404" y="398" font-size="11.5" fill="#8a93b5" text-anchor="middle">fixed supply · authorities revoked</text>
    <rect x="374" y="336" width="60" height="17" rx="8.5" fill="#12341f"/>
    <text x="404" y="348" font-size="9" fill="#5fd08a" text-anchor="middle" letter-spacing="1.4">LIVE</text>
  </g>

  <g>
    <text x="561" y="632" font-size="17.5" fill="#eadfc4" text-anchor="middle"
          font-family="Georgia, serif">The Vault of Halves</text>
    <text x="561" y="652" font-size="11.5" fill="#8a93b5" text-anchor="middle">half the light, sealed away</text>
    <rect x="531" y="664" width="60" height="17" rx="8.5" fill="#12341f"/>
    <text x="561" y="676" font-size="9" fill="#5fd08a" text-anchor="middle" letter-spacing="1.4">LIVE</text>
  </g>

  <g>
    <text x="714" y="416" font-size="17.5" fill="#eadfc4" text-anchor="middle"
          font-family="Georgia, serif">The Cabinet Yard</text>
    <text x="714" y="436" font-size="11.5" fill="#8a93b5" text-anchor="middle">cabinets brought back by hand</text>
    <rect x="668" y="374" width="92" height="17" rx="8.5" fill="#3a2f16"/>
    <text x="714" y="386" font-size="9" fill="#c9a84c" text-anchor="middle" letter-spacing="1.4">IN PROGRESS</text>
  </g>

  <g>
    <text x="866" y="640" font-size="17.5" fill="#eadfc4" text-anchor="middle"
          font-family="Georgia, serif">The Backglass Gate</text>
    <text x="866" y="660" font-size="11.5" fill="#8a93b5" text-anchor="middle">press start · the way in</text>
    <rect x="820" y="672" width="92" height="17" rx="8.5" fill="#3a2f16"/>
    <text x="866" y="684" font-size="9" fill="#c9a84c" text-anchor="middle" letter-spacing="1.4">IN PROGRESS</text>
  </g>

  <g>
    <text x="972" y="368" font-size="17.5" fill="#eadfc4" text-anchor="middle"
          font-family="Georgia, serif">The Free Lantern</text>
    <text x="972" y="388" font-size="11.5" fill="#8a93b5" text-anchor="middle">anyone may take one · no toll</text>
    <rect x="944" y="326" width="56" height="17" rx="8.5" fill="#1b2c46"/>
    <text x="972" y="338" font-size="9" fill="#7fb0e0" text-anchor="middle" letter-spacing="1.4">NEXT</text>
  </g>

  <g>
    <text x="1110" y="616" font-size="17.5" fill="#eadfc4" text-anchor="middle"
          font-family="Georgia, serif">The Counter</text>
    <text x="1110" y="636" font-size="11.5" fill="#8a93b5" text-anchor="middle">a credit becomes play</text>
    <rect x="1082" y="648" width="56" height="17" rx="8.5" fill="#1b2c46"/>
    <text x="1110" y="660" font-size="9" fill="#7fb0e0" text-anchor="middle" letter-spacing="1.4">NEXT</text>
  </g>

  <g>
    <text x="1237" y="352" font-size="17.5" fill="#eadfc4" text-anchor="middle"
          font-family="Georgia, serif">The Coining House</text>
    <text x="1237" y="372" font-size="11.5" fill="#8a93b5" text-anchor="middle">struck once, played forever</text>
    <rect x="1209" y="310" width="56" height="17" rx="8.5" fill="#1b2c46"/>
    <text x="1237" y="322" font-size="9" fill="#7fb0e0" text-anchor="middle" letter-spacing="1.4">NEXT</text>
  </g>

  <g>
    <text x="1392" y="592" font-size="17.5" fill="#eadfc4" text-anchor="middle"
          font-family="Georgia, serif">The First Castle Wakes</text>
    <text x="1392" y="612" font-size="11.5" fill="#8a93b5" text-anchor="middle">one marquee, lit again</text>
    <rect x="1358" y="624" width="68" height="17" rx="8.5" fill="#2a2140"/>
    <text x="1392" y="636" font-size="9" fill="#b49ae0" text-anchor="middle" letter-spacing="1.4">DREAMING</text>
  </g>

  <g>
    <text x="1502" y="452" font-size="15" fill="#9aa2c0" text-anchor="middle"
          font-family="Georgia, serif">The Long Road</text>
    <text x="1502" y="470" font-size="10.5" fill="#6d769a" text-anchor="middle">and the ones after</text>
  </g>
</g>

<!-- ── footer ──────────────────────────────────────────────────────────── -->
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <path d="M88 806 H1512" stroke="#2a3352" stroke-width="1"/>
  <text x="88" y="836" font-size="12.5" fill="#7d86a8" letter-spacing="2">
    INSTAR BRANDS LLC &#183; $ACM &#183; INSTARBRANDS.COM</text>
  <text x="1512" y="836" font-size="11" fill="#5f688a" text-anchor="end" letter-spacing=".8">
    No price targets. No dates. No promises of value. $ACM is a highly speculative digital asset.</text>
</g>

<rect width="1600" height="900" filter="url(#grain)" opacity=".045" style="mix-blend-mode:overlay"/>
</svg>
